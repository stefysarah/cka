apiVersion: v1
kind: Namespace
metadata:
  name: static-pod
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: nginx-sp
  name: nginx-sp
  namespace: static-pod
spec:
  containers:
  - image: nginx:1.14.2
    name: nginx-sp
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
